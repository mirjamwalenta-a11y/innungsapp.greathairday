    --muted:#6B7684; --border:#D6DAE0; --error:#C0392B;

  input,textarea,button { font-family:inherit; }

  #loadingScreen { position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9999; }
  #loadingScreen p { color:rgba(255,255,255,0.6);font-size:13px; }
  .spinner { width:32px;height:32px;border:3px solid rgba(255,255,255,0.2);border-top-color:var(--copper);border-radius:50%;animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }

  #loginScreen { min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:16px; }
  .login-card { background:var(--white);border-radius:14px;padding:40px 32px;width:100%;max-width:340px;box-shadow:0 8px 40px rgba(0,0,0,0.2); }
  .brand { display:flex;align-items:center;gap:8px;margin-bottom:28px; }
  .brand-dot { width:10px;height:10px;border-radius:50%;background:var(--copper);flex-shrink:0; }
  .brand-name { font-weight:800;font-size:14px;color:var(--navy); }
  .brand-sub { font-size:10px;color:var(--muted);font-weight:500;letter-spacing:0.04em; }

  #appScreen { display:none; }
  .topbar { background:var(--navy);height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100; }
  .topbar-brand { display:flex;align-items:center;gap:8px; }
  .topbar-dot { width:8px;height:8px;border-radius:50%;background:var(--copper); }
  .topbar-name { color:var(--white);font-weight:800;font-size:13px; }
  .topbar-sub { color:rgba(255,255,255,0.6);font-size:10px;font-weight:500;letter-spacing:0.05em; }
  .topbar-logout { background:none;border:1px solid rgba(255,255,255,0.3);border-radius:6px;color:var(--white);font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer; }
  .rollenbar { padding:5px 20px;font-size:12px;color:var(--white);font-weight:500; }
  .rollenbar.org { background:var(--copper); }
  .rollenbar.trainer { background:#2C4056; }
  .sync-bar { background:var(--white);border-bottom:1px solid var(--border);padding:4px 20px;font-size:11px;color:var(--muted);text-align:right; }

  .tabnav { display:flex;border-bottom:2px solid var(--border);background:var(--white);padding-left:16px;overflow-x:auto; }
  .tabnav button { padding:11px 16px;font-size:13px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:400; }
  .tabnav button.aktiv { color:var(--navy);font-weight:700;border-bottom-color:var(--copper); }

  .content { max-width:660px;margin:0 auto;padding:24px 16px; }

  .btn { padding:9px 20px;font-size:14px;font-weight:600;border-radius:6px;cursor:pointer;border:none;transition:opacity 0.15s; }
  .btn:disabled { opacity:0.45;cursor:not-allowed; }
  .btn-primary { background:var(--navy);color:var(--white); }
  .btn-secondary { background:var(--white);color:var(--navy);border:1px solid var(--border)!important; }
  .btn-danger { background:#FEF2F2;color:var(--error);border:1px solid #FECACA!important; }
  .btn-small { padding:5px 12px;font-size:12px; }
  .back-btn { background:none;border:none;cursor:pointer;font-size:22px;color:var(--muted);padding:0;line-height:1;flex-shrink:0; }

  .lbl { display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase; }
  .inp { width:100%;padding:9px 12px;font-size:14px;border:1px solid var(--border);border-radius:6px;outline:none;color:var(--navy);background:var(--white); }
  .inp:focus { border-color:var(--navy); }
  textarea.inp { resize:vertical;font-family:inherit; }
  .form-card { background:var(--white);border-radius:10px;border:1px solid var(--border);padding:20px; }
  .form-actions { display:flex;gap:10px;margin-top:16px;justify-content:flex-end; }
  .grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:12px; }

  .card { background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden; }
  .card-header { background:var(--navy);padding:20px 24px;color:var(--white); }
  .card-header-label { font-size:11px;opacity:0.6;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em; }
  .card-header-title { font-size:18px;font-weight:800; }
  .card-body { padding:16px 24px; }
  .detail-row { display:flex;gap:16px;margin-bottom:12px; }
  .detail-label { min-width:120px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase; }
  .detail-value { font-size:14px; }

  .list-item { background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;display:flex;gap:16px;align-items:flex-start;transition:border-color 0.15s; }
  .list-item:hover { border-color:var(--navy); }
  .date-badge { min-width:48px;text-align:center;background:var(--navy);border-radius:8px;padding:8px 6px;color:var(--white);flex-shrink:0; }
  .date-day { font-size:18px;font-weight:800;line-height:1; }
  .date-mon { font-size:10px;margin-top:2px;opacity:0.75; }
  .list-arrow { color:var(--border);font-size:18px;align-self:center; }

  .badge { font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;white-space:nowrap; }
  .badge-vergeben { background:var(--navy);color:var(--white); }
  .badge-interesse { background:var(--green-bg);color:var(--green);border:1px solid var(--green-border); }
  .badge-offen { background:var(--slate);color:var(--muted);border:1px solid var(--border); }
  .badge-bereich { background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE;font-size:11px;padding:2px 8px;border-radius:4px; }
  .badge-kat-newcomer { background:#FFF7ED;color:#C2410C;border:1px solid #FED7AA;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600; }
  .badge-kat-zwischen { background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600; }
  .badge-kat-lap { background:#FDF4FF;color:#7E22CE;border:1px solid #E9D5FF;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600; }

  .avatar { width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--white);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .interesse-box { border-radius:10px;padding:16px 20px;border:1px solid var(--border); }

  .ll-item { background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:flex;align-items:flex-start;gap:12px; }
  .ll-nr { font-size:13px;font-weight:800;color:var(--copper);min-width:24px;padding-top:1px; }
  .ll-sort-btns { display:flex;flex-direction:column;gap:2px; }
  .ll-sort-btn { background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;padding:2px 6px;color:var(--muted); }

  .trainer-item { background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color 0.15s; }

  .bereiche-grid { display:flex;flex-wrap:wrap;gap:8px;margin-top:6px; }
  .bereich-check { display:none; }
  .bereich-chip { display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;background:var(--white);color:var(--muted);transition:all 0.15s;user-select:none; }
  .bereich-check:checked + .bereich-chip { background:#EEF2FF;border-color:#818CF8;color:#3730A3;font-weight:600; }

  /* Verfügbarkeits-Zeile beim Seminar */
  .verfueg-bar { background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:10px; }

  .verfueg-bar .av-label { font-size:12px;color:var(--muted); }

  .section-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:20px; }
  .section-title { font-size:20px;font-weight:700; }
  .empty { text-align:center;padding:48px 0;color:var(--muted);font-size:14px; }

  #toast { position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--error);color:var(--white);padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;display:none;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.2); }

  .list-stack { display:flex;flex-direction:column;gap:10px; }
  .list-stack-sm { display:flex;flex-direction:column;gap:8px; }
  .row-header { display:flex;align-items:center;gap:12px;margin-bottom:20px; }
  .ml-auto { margin-left:auto; }
  .mt-4 { margin-top:16px; }
  .mb-3 { margin-bottom:12px; }
  .mb-4 { margin-bottom:16px; }
  .interesse-list-header { padding:10px 20px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center; }
  .count-badge { border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;color:var(--white); }
  .interesse-list-item { padding:12px 20px;display:flex;align-items:center;gap:10px; }
  .vergeben-footer { padding:10px 20px;background:var(--green-bg);border-top:1px solid var(--green-border);font-size:12px;color:var(--green);font-weight:600; }

  .einsatz-pill { font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--slate);color:var(--muted);border:1px solid var(--border); }
  .einsatz-pill.wenig { background:#EEF6EE;color:var(--green);border-color:var(--green-border); }
  .einsatz-pill.viel { background:#FEF9EE;color:#92400E;border-color:#FDE68A; }

</head>

// ── STATE ──
let session=null;
let seminare=[],trainerinnen=[],leitlinien=[],bereiche=[],trainerBereiche=[],einsaetze={};
let activeTab='seminare';
let semScreen='liste',selSeminar=null;
let llScreen='liste',selLL=null;
let trScreen='liste',selTr=null;
let berScreen='liste',selBer=null;

// ── INIT ──
function zeigeLogin(){
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginPin').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('loginKennung').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('loginPin').focus(); });
}
window.addEventListener('DOMContentLoaded',async()=>{
  const saved=localStorage.getItem('innungsapp_session');
  if(saved){
    try{
      session=JSON.parse(saved);
      session.id=String(session.id);
      await loadAllData();
      showApp();
      return;
    }catch(e){
      localStorage.removeItem('innungsapp_session');
    }
  }
  zeigeLogin();
});

// ── LOGIN ──
async function doLogin(){
  const kennung=document.getElementById('loginKennung').value.trim().toLowerCase();
  const pin=document.getElementById('loginPin').value;
  document.getElementById('loginFehler').style.display='none';
  document.getElementById('loginBtn').disabled=true;
  document.getElementById('loginBtn').textContent='Wird geprüft…';
  try{
    const rows=await sbGet('innungs_trainerinnen',`kennung=eq.${encodeURIComponent(kennung)}&pin_hash=eq.${encodeURIComponent(md5(pin))}&aktiv=eq.true`);
    if(rows.length===0){
      document.getElementById('loginFehler').style.display='block';
      document.getElementById('loginBtn').disabled=false;
      document.getElementById('loginBtn').textContent='Anmelden';
      return;
    }
    const t=rows[0];
    session={rolle:t.id==='org'?'organisatorin':'trainerin',id:String(t.id),name:t.name,kennung:t.kennung};
    localStorage.setItem('innungsapp_session',JSON.stringify(session));
    await loadAllData();
    showApp();
  }catch(e){
    showToast('Verbindungsfehler: '+e.message);
    document.getElementById('loginBtn').disabled=false;
    document.getElementById('loginBtn').textContent='Anmelden';
  }
}

function doLogout(){
  session=null; localStorage.removeItem('innungsapp_session');
  document.getElementById('appScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginKennung').value='';
  document.getElementById('loginPin').value='';
}

// ── DATEN LADEN ──
function withTimeout(promise, ms=10000){
  return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('Zeitüberschreitung – bitte neu laden')),ms))]);
}
async function loadAllData(){
  setSyncStatus('syncing');
  try{
    const [sem,tr,ll,int,ber,tb] = await withTimeout(Promise.all([
      sbGet('innungs_seminare','order=datum.asc,uhrzeit.asc'),
      sbGet('innungs_trainerinnen','order=name.asc'),
      sbGet('innungs_leitlinien','order=reihenfolge.asc'),
      sbGet('innungs_interessierte',''),
      sbGet('innungs_bereiche','order=reihenfolge.asc'),
      sbGet('innungs_trainerin_bereiche','')
    ]));
    // Alle IDs als String normalisieren damit === Vergleiche funktionieren
    trainerinnen = tr.map(t=>({...t, id:String(t.id)}));
    leitlinien = ll;
    bereiche = ber.map(b=>({...b, id:String(b.id)}));
    trainerBereiche = tb.map(x=>({trainerin_id:String(x.trainerin_id), bereich_id:String(x.bereich_id)}));
    seminare = sem.map(s=>({
      ...s,
      id: String(s.id),
      bestaetigte_person_id: s.bestaetigte_person_id!=null ? String(s.bestaetigte_person_id) : null,
      bereich_id: s.bereich_id!=null ? String(s.bereich_id) : null,
      interessierte: int.filter(i=>String(i.seminar_id)===String(s.id)).map(i=>String(i.trainerin_id))
    }));
    if(session) session.id = String(session.id);
    // Einsatz-Zähler: wie oft wurde jede Trainer:in pro Bereich bestätigt
    einsaetze={};
    seminare.forEach(s=>{
      if(s.bestaetigte_person_id){
        const key=`${s.bestaetigte_person_id}__${s.bereich_id||'_'}`;
        einsaetze[key]=(einsaetze[key]||0)+1;
      }
    });
    setSyncStatus('synced');
  }catch(e){
    setSyncStatus('error');
    showToast('Ladefehler: '+e.message);
    // Login-Button wieder freischalten falls noch auf Login-Screen
    const btn=document.getElementById('loginBtn');
    if(btn){ btn.disabled=false; btn.textContent='Anmelden'; }
  }
}

function setSyncStatus(s){
  const el=document.getElementById('syncStatus'); if(!el)return;
  const map={syncing:'🔄 Synchronisiert…',synced:'☁️ Synchronisiert',error:'⚠️ Sync-Fehler'};
  const colors={syncing:'var(--copper)',synced:'var(--green)',error:'var(--error)'};
  el.textContent=map[s]||s; el.style.color=colors[s]||'var(--muted)';
}

// ── APP ──
function showApp(){
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  const rb=document.getElementById('rollenbar');
  if(session.rolle==='organisatorin'){
    rb.textContent='Angemeldet als: Organisatorin'; rb.className='rollenbar org';
  }else{
    rb.textContent=`Angemeldet als: ${session.name}`; rb.className='rollenbar trainer';
  }
  const tabnav=document.getElementById('tabnav');
  if(session.rolle==='organisatorin'){
    if(!document.getElementById('tab-verwaltung')){
      ['Trainer:innen','Kursbereiche'].forEach((label,i)=>{
        const id=['tab-verwaltung','tab-bereiche'][i];
        const tab=['verwaltung','bereiche'][i];
        const btn=document.createElement('button');
        btn.id=id; btn.textContent=label; btn.onclick=()=>showTab(tab);
        tabnav.appendChild(btn);
      });
    }
  }
  semScreen='liste'; llScreen='liste'; trScreen='liste'; berScreen='liste';
  selSeminar=null; selLL=null; selTr=null; selBer=null;
  showTab('seminare');
}

function showTab(tab){
  activeTab=tab;
  ['seminare','leitlinien','verwaltung','bereiche'].forEach(t=>{
    const el=document.getElementById(`tab-${t}`);
    if(el) el.className=t===tab?'aktiv':'';
  });
  render();
}

function render(){
  const c=document.getElementById('mainContent');
  if(activeTab==='seminare'){
    if(semScreen==='liste') c.innerHTML=renderSeminarListe();
    else if(semScreen==='detail') c.innerHTML=renderSeminarDetail();
    else c.innerHTML=renderSeminarFormular();
  }else if(activeTab==='leitlinien'){
    if(llScreen==='liste') c.innerHTML=renderLLListe();
    else if(llScreen==='detail') c.innerHTML=renderLLDetail();
    else c.innerHTML=renderLLFormular();
  }else if(activeTab==='verwaltung'){
    if(trScreen==='liste') c.innerHTML=renderTrListe();
    else if(trScreen==='detail') c.innerHTML=renderTrDetail();
    else c.innerHTML=renderTrFormular();
  }else if(activeTab==='bereiche'){
    if(berScreen==='liste') c.innerHTML=renderBerListe();
    else c.innerHTML=renderBerFormular();
  }
}

// ── HELPERS ──
function tName(id){ return trainerinnen.find(t=>t.id===id)?.name??id; }
function bName(id){ return bereiche.find(b=>b.id===id)?.name??''; }
function fmtDatum(iso){ const[y,m,d]=iso.split('-'); return`${d}.${m}.${y}`; }
function initials(name){ return name.split(' ').map(n=>n[0]).join('').toUpperCase(); }
function trBereiche(tid){ return trainerBereiche.filter(tb=>tb.trainerin_id===tid).map(tb=>tb.bereich_id); }
function statusBadge(s){
  if(s.bestaetigte_person_id) return`<span class="badge badge-vergeben">Vergeben</span>`;
  if(s.interessierte.length>0) return`<span class="badge badge-interesse">Interesse vorhanden</span>`;
  return`<span class="badge badge-offen">Offen</span>`;
}
function einsatzPill(tid,bereichId){
  const key=`${tid}__${bereichId||'_'}`;
  const n=einsaetze[key]||0;
  const cls=n<=3?'wenig':n>=8?'viel':'';
  return`<span class="einsatz-pill ${cls}">${n}× eingesetzt</span>`;
}
function showToast(msg){ const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3500); }
function escHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return String(s??'').replace(/"/g,'&quot;'); }

// ── AUTO-EINTEILUNG ──
async function autoEinteilen() {
  // 1. Nur offene Seminare filtern
  const offene = seminare.filter(s => !s.bestaetigte_person_id);
  if (offene.length === 0) {
    showToast('Keine offenen Seminare vorhanden.');
    return;
  }
  let zugeteilt = 0;
  for (const sem of offene) {
    if (!sem.bereich_id) continue; // Ohne Bereich keine Automatik
    // 2. Aktive Trainer:innen für diesen Bereich ermitteln
    let kandidaten = trainerinnen.filter(t =>
      t.aktiv &&
      t.id !== 'org' &&
      trBereiche(t.id).includes(sem.bereich_id)
    );
    if (kandidaten.length === 0) continue;
    // 3. Wenn jemand Interesse gemeldet hat, diese bevorzugen
    const interessierte = kandidaten.filter(t => sem.interessierte.includes(t.id));
    const pool = interessierte.length > 0 ? interessierte : kandidaten;
    // 4. Nach bisherigen Einsätzen sortieren (Fairness / wenigste Einsätze zuerst)
    pool.sort((a, b) => {
      const anzA = einsaetze[`${a.id}__${sem.bereich_id}`] || 0;
      const anzB = einsaetze[`${b.id}__${sem.bereich_id}`] || 0;
      return anzA - anzB;
    });
    const gewaehlt = pool[0];
    // 5. In Supabase speichern & lokalen Status updaten
    try {
      await sbPatch('innungs_seminare', `id=eq.${sem.id}`, {
        bestaetigte_person_id: gewaehlt.id
      });
      sem.bestaetigte_person_id = gewaehlt.id;
      // Einsatz-Zähler aktualisieren
      const key = `${gewaehlt.id}__${sem.bereich_id}`;
      einsaetze[key] = (einsaetze[key] || 0) + 1;
      zugeteilt++;
    } catch(e) {
      console.error('Fehler bei Seminar-Zuweisung:', e);
    }
  }
  showToast(`${zugeteilt} Seminar(e) automatisch zugeteilt!`);
  render();
}

// ── SEMINARE LISTE ──
function renderSeminarListe(){
  // Alle Seminare anzeigen; bestätigte Kurse des Trainers zuerst
  let sems=seminare;
  if(session.rolle==='trainerin'){
    const meine=sems.filter(s=>s.bestaetigte_person_id===session.id);
    const rest=sems.filter(s=>s.bestaetigte_person_id!==session.id);
    sems=[...meine,...rest];
  }
  const addBtn = session.rolle === 'organisatorin'
    ? `<div style="display:flex;gap:8px">
         <button class="btn btn-secondary" onclick="autoEinteilen()">⚡ Auto-Einteilung</button>
         <button class="btn btn-primary" onclick="semNeu()">+ Termin anlegen</button>
       </div>`
    : '';
  if(sems.length===0){
    return`<div class="section-header"><h2 class="section-title">Seminartermine</h2>${addBtn}</div>
           <div class="empty">Noch keine Termine eingetragen.</div>`;
  }
  const items=sems.map(s=>{
    const day=s.datum.split('-')[2];
    const mon=MONATE[parseInt(s.datum.split('-')[1])-1];
    const berBadge=s.bereich_id?`<span class="badge-bereich">${escHtml(bName(s.bereich_id))}</span>`:'';
    const ichBestaetigt=s.bestaetigte_person_id===session.id;
    const itemStyle=ichBestaetigt?'border-color:var(--green);background:var(--green-bg)':'';
    const meinBadge=ichBestaetigt?`<span class="badge badge-interesse">✓ Mein Kurs</span>`:'';
    return`<div class="list-item" style="${itemStyle}" onclick="semSelect(${s.id})">
      <div class="date-badge"><div class="date-day">${day}</div><div class="date-mon">${mon}</div></div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap">
          <span style="font-weight:700;font-size:14px">${escHtml(s.titel)}</span>
          ${meinBadge||statusBadge(s)}
        </div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:3px">${s.uhrzeit.slice(0,5)} Uhr · ${escHtml(s.ort)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:3px">${berBadge}${s.kategorie?katBadge(s.kategorie):''}</div>
      </div>
      <div class="list-arrow">›</div>
    </div>`;
  }).join('');
  return`<div class="section-header"><h2 class="section-title">Seminartermine</h2>${addBtn}</div>
         <div class="list-stack">${items}</div>`;
}

function semSelect(id){ selSeminar=seminare.find(s=>s.id===id); semScreen='detail'; render(); }
function semNeu(){ selSeminar=null; semScreen='neu'; render(); }

// ── SEMINARE DETAIL ──
function renderSeminarDetail(){
  if(!selSeminar){ semScreen='liste'; return renderSeminarListe(); }
  const s=selSeminar;
  const vergeben=!!s.bestaetigte_person_id;
  const hatInteresse=s.interessierte.includes(session.id);
  const ichBestaetigt=s.bestaetigte_person_id===session.id;
  const editBtn=session.rolle==='organisatorin'?`<button class="btn btn-secondary ml-auto" onclick="semBearbeiten()">Bearbeiten</button>`:'';
  const berBadge=s.bereich_id?`<span class="badge-bereich" style="margin-left:4px">${escHtml(bName(s.bereich_id))}</span>`:'';

  let interesseBox='';
  if(session.rolle==='trainerin'){
    if(vergeben&&ichBestaetigt){
      interesseBox=`<div class="interesse-box" style="background:var(--green-bg);border-color:var(--green-border)">
        <div style="font-weight:700;color:var(--green);font-size:14px">✓ Du bist für diesen Kurs bestätigt.</div></div>`;
    }else if(vergeben){
      const wer = tName(s.bestaetigte_person_id);
      interesseBox=`<div class="interesse-box"><div style="color:var(--muted);font-size:14px">Dieser Kurs ist vergeben an: <strong>${escHtml(wer)}</strong>.</div></div>`;
    }else if(hatInteresse){
      interesseBox=`<div class="interesse-box" style="background:var(--green-bg);border-color:var(--green-border)">
        <div style="font-weight:700;color:var(--green);font-size:14px;margin-bottom:12px">✓ Du hast Interesse gemeldet.</div>
        <button class="btn btn-secondary" onclick="toggleInteresse('zurueckziehen')">Interesse zurückziehen</button></div>`;
    }else{
      interesseBox=`<div class="interesse-box">
        <div style="font-size:13px;color:var(--muted);margin-bottom:12px">Du hast noch kein Interesse gemeldet.</div>
        <button class="btn btn-primary" onclick="toggleInteresse('melden')">Interesse melden</button></div>`;
    }
  }

  let orgBox='';
  if(session.rolle==='organisatorin'){
    // Verfügbare Trainer (haben diesen Bereich, noch nicht vergeben)
    let verfuegbar=[];
    if(s.bereich_id&&!vergeben){
      verfuegbar=trainerinnen.filter(t=>t.aktiv&&t.id!=='org'&&trBereiche(t.id).includes(s.bereich_id)&&!s.interessierte.includes(t.id));
    }
    const verfBar=s.bereich_id&&!vergeben&&verfuegbar.length>0?`
      <div style="padding:10px 20px;background:#F0F4FF;border-bottom:1px solid #C7D2FE">
        <div style="font-size:11px;font-weight:700;color:#3730A3;text-transform:uppercase;margin-bottom:6px">Verfügbare Trainer:innen für diesen Bereich</div>
        ${verfuegbar.map(t=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <div class="avatar" style="width:24px;height:24px;font-size:10px">${initials(t.name)}</div>
          <span style="font-size:13px">${escHtml(t.name)}</span>
          ${einsatzPill(t.id,s.bereich_id)}
        </div>`).join('')}
      </div>`:'' ;

    const countColor=s.interessierte.length>0?'var(--navy)':'var(--border)';
    const rows=s.interessierte.length===0
      ?`<div style="padding:14px 20px;font-size:13px;color:var(--muted)">Noch keine Meldung.</div>`
      :s.interessierte.map((tid,i)=>{
          const name=tName(tid);
          const best=s.bestaetigte_person_id===tid;
          const border=i<s.interessierte.length-1?'border-bottom:1px solid var(--border)':'';
          const action=best
            ?`<span style="font-size:12px;font-weight:700;color:var(--green)">✓ Bestätigt</span>`
            :!vergeben
              ?`<button class="btn btn-primary btn-small" onclick="bestaetigen('${tid}')">Bestätigen</button>`:'';
          const avBg=best?'var(--green)':'var(--navy)';
          return`<div class="interesse-list-item" style="${border}">
            <div class="avatar" style="background:${avBg}">${initials(name)}</div>
            <div style="flex:1">
              <div style="font-size:14px">${escHtml(name)}</div>
              ${s.bereich_id?`<div style="margin-top:2px">${einsatzPill(tid,s.bereich_id)}</div>`:''}
            </div>
            ${action}
          </div>`;
        }).join('');
    const vergebenFooter=vergeben?`<div class="vergeben-footer">Vergeben an: ${escHtml(tName(s.bestaetigte_person_id))}</div>`:'';
    orgBox=`<div class="card mt-4">${verfBar}
      <div class="interesse-list-header">
        <span>Interesse gemeldet</span>
        <span class="count-badge" style="background:${countColor}">${s.interessierte.length}</span>
      </div>
      ${rows}${vergebenFooter}</div>`;
  }

  const opt=(l,v)=>v?`<div class="detail-row"><div class="detail-label">${l}</div><div class="detail-value">${escHtml(v)}</div></div>`:'';
  return`<div class="row-header">
    <button class="back-btn" onclick="semZurueck()">‹</button>
    <h2 style="font-size:20px;font-weight:700">Seminardetail</h2>
    ${editBtn}
  </div>
  <div class="card mb-4">
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
        <div class="card-header-label" style="margin-bottom:0">Seminar</div>
        ${berBadge}${s.kategorie?`<span class="${KATEGORIEN.find(x=>x.id===s.kategorie)?.css||''}" style="opacity:0.9">${KATEGORIEN.find(x=>x.id===s.kategorie)?.label||''}</span>`:''}
      </div>
      <div class="card-header-title">${escHtml(s.titel)}</div>
    </div>
    <div class="card-body">
      ${opt('Datum',fmtDatum(s.datum))}
      ${opt('Uhrzeit',s.uhrzeit.slice(0,5)+' Uhr')}
      ${opt('Ort',s.ort)}
      ${opt('Zielgruppe',s.zielgruppe_thema)}
      ${opt('Besonderheiten',s.besonderheiten)}
    </div>
  </div>
  ${interesseBox}${orgBox}`;
}

function semZurueck(){ semScreen='liste'; selSeminar=null; render(); }
function semBearbeiten(){ semScreen='bearbeiten'; render(); }

async function toggleInteresse(aktion){
  const sid=selSeminar.id,tid=session.id;
  try{
    if(aktion==='melden'){
      await sbPost('innungs_interessierte',{seminar_id:sid,trainerin_id:tid});
      selSeminar.interessierte.push(tid);
      seminare=seminare.map(s=>s.id===sid?{...s,interessierte:[...s.interessierte,tid]}:s);
      // ── GHD-EREIGNIS: Interesse gemeldet ──────────────────────
      innungsEreignis('interesse_gemeldet', `Interesse: ${tName(tid)} für „${selSeminar.titel}"`, 'diese-woche');
    }else{
      await sbDelete('innungs_interessierte',`seminar_id=eq.${sid}&trainerin_id=eq.${encodeURIComponent(tid)}`);
      selSeminar.interessierte=selSeminar.interessierte.filter(x=>x!==tid);
      seminare=seminare.map(s=>s.id===sid?{...s,interessierte:s.interessierte.filter(x=>x!==tid)}:s);
    }
    render();
  }catch(e){ showToast('Fehler: '+e.message); }

async function trSpeichern(istNeu){
  const name=document.getElementById('trName').value.trim();
  const kennung=document.getElementById('trKennung').value.trim().toLowerCase();
  const pin=document.getElementById('trPin').value;
  const gewBereiche=[...document.querySelectorAll('.bereich-check:checked')].map(el=>el.value);
  if(!name||!kennung){ showToast('Name und Kennung sind Pflichtfelder.'); return; }
  if(istNeu&&pin.length!==4){ showToast('PIN muss 4-stellig sein.'); return; }
  if(pin&&(pin.length!==4||!/^\d+$/.test(pin))){ showToast('PIN: nur 4 Ziffern.'); return; }
  const duplikat=trainerinnen.some(t=>t.kennung===kennung&&(istNeu||t.id!==selTr.id));
  if(duplikat){ showToast('Kennung bereits vergeben.'); return; }
  try{
    let tid;
    if(istNeu){
      const body={name,kennung,pin_hash:md5(pin),aktiv:true};
      const rows=await sbPost('innungs_trainerinnen',body);
      trainerinnen=[...trainerinnen,rows[0]];
      tid=rows[0].id; trScreen='liste'; selTr=null;
    }else{
      const body={name,kennung};
      if(pin.length===4) body.pin_hash=md5(pin);
      await sbPatch('innungs_trainerinnen',`id=eq.${encodeURIComponent(selTr.id)}`,body);
      selTr={...selTr,name,kennung};
      trainerinnen=trainerinnen.map(t=>t.id===selTr.id?selTr:t);
      tid=selTr.id; trScreen='detail';
    }
    // Bereiche synchronisieren: alte löschen, neue einfügen
    await sbDelete('innungs_trainerin_bereiche',`trainerin_id=eq.${encodeURIComponent(tid)}`);
    if(gewBereiche.length>0){
      await sbPost('innungs_trainerin_bereiche',gewBereiche.map(bid=>({trainerin_id:tid,bereich_id:bid})));
    }
    // Lokalen State aktualisieren
    trainerBereiche=trainerBereiche.filter(tb=>tb.trainerin_id!==tid);
    gewBereiche.forEach(bid=>trainerBereiche.push({trainerin_id:tid,bereich_id:bid}));
    render();
  }catch(e){ showToast('Fehler: '+e.message); }
}

  </div>
  <div class="form-actions">
    <button class="btn btn-secondary" onclick="berScreen='liste';render()">Abbrechen</button>
    <button class="btn btn-primary" onclick="berSpeichern(${istNeu})">Speichern</button>
  </div>`;
}

async function berSpeichern(istNeu){
  const name=document.getElementById('berName').value.trim();
  if(!name){ showToast('Bitte einen Namen eingeben.'); return; }
  try{
    if(istNeu){
      const maxR=bereiche.reduce((m,b)=>Math.max(m,b.reihenfolge),0);
      const rows=await sbPost('innungs_bereiche',{name,reihenfolge:maxR+1});
      bereiche=[...bereiche,rows[0]];
    }else{
      await sbPatch('innungs_bereiche',`id=eq.${selBer.id}`,{name});
      bereiche=bereiche.map(b=>b.id===selBer.id?{...b,name}:b);
    }
    berScreen='liste'; selBer=null; render();
  }catch(e){ showToast('Fehler: '+e.message); }
}
</script>
</body>
</html>
